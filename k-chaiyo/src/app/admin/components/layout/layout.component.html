<div class="admin-layout" [class.sidebar-collapsed]="isSidebarCollapsed">
  <!-- Sidebar -->
  <aside class="sidebar" [class.mobile-open]="showMobileMenu">
    <div class="sidebar-header">
      <div class="logo" *ngIf="!isSidebarCollapsed">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="12" fill="#3b82f6"/>
          <path d="M24 14L34 24L24 34L14 24L24 14Z" fill="white"/>
        </svg>
        <span>K Chaiyo</span>
      </div>
      <div class="logo-collapsed" *ngIf="isSidebarCollapsed">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="12" fill="#3b82f6"/>
          <path d="M24 14L34 24L24 34L14 24L24 14Z" fill="white"/>
        </svg>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a
        *ngFor="let item of menuItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeMobileMenu()"
      >
        <span class="nav-icon">
          <!-- Dashboard Icon -->
          <svg *ngIf="item.icon === 'dashboard'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
          </svg>

          <!-- Visitors Icon -->
          <svg *ngIf="item.icon === 'visitors'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>

          <!-- Submissions Icon -->
          <svg *ngIf="item.icon === 'submissions'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </span>
        <span class="nav-label" *ngIf="!isSidebarCollapsed">{{ item.label }}</span>
        <span class="nav-badge" *ngIf="item.badge && !isSidebarCollapsed">
          <span class="badge-dot"></span>
        </span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="collapse-btn" (click)="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline [attr.points]="isSidebarCollapsed ? '9 18 15 12 9 6' : '15 18 9 12 15 6'"/>
        </svg>
        <span *ngIf="!isSidebarCollapsed">Collapse</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <button class="mobile-menu-btn" (click)="toggleMobileMenu()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <h2 class="page-title">Admin Panel</h2>
      </div>

      <div class="header-right">
        <div class="user-menu" [class.open]="showUserMenu">
          <button class="user-btn" (click)="toggleUserMenu()">
            <div class="user-avatar">
              {{ getUserInitials() }}
            </div>
            <div class="user-info" *ngIf="currentUser">
              <span class="user-name">{{ currentUser.username }}</span>
              <span class="user-role" [ngClass]="getRoleBadgeClass()">
                {{ currentUser.role.replace('_', ' ') }}
              </span>
            </div>
            <svg class="dropdown-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>

          <div class="user-dropdown" *ngIf="showUserMenu" (click)="closeUserMenu()">
            <div class="dropdown-header" *ngIf="currentUser">
              <div class="dropdown-user-info">
                <strong>{{ currentUser.username }}</strong>
                <small>{{ currentUser.email }}</small>
              </div>
            </div>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item logout" (click)="logout()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Mobile Overlay -->
  <div class="mobile-overlay" *ngIf="showMobileMenu" (click)="closeMobileMenu()"></div>
</div>
