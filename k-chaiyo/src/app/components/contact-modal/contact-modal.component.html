<div class="modal-overlay" *ngIf="isOpen$ | async" (click)="onBackdropClick($event)">
  <div class="modal-content">
    <button class="close-btn" (click)="close()">
      <i class="fas fa-xmark"></i>
    </button>

    <!-- Form State -->
    <div class="modal-form" *ngIf="!submitted">
      <div class="modal-header">
        <div class="modal-icon">
          <i class="fas fa-envelope-open"></i>
        </div>
        <h2 class="modal-title">Join Our Waitlist!</h2>
        <p class="modal-subtitle">Pahilo mai thaha paunu hos — be the first to know when we launch!</p>
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group" [class.has-error]="errors['name']">
          <label class="form-label">Full Name <span class="required">*</span></label>
          <div class="input-wrapper">
            <i class="fas fa-user input-icon"></i>
            <input
              type="text"
              [(ngModel)]="formData.name"
              name="name"
              placeholder="Enter your name"
            />
          </div>
          <span class="error-text" *ngIf="errors['name']"><i class="fas fa-circle-exclamation"></i> {{ errors['name'] }}</span>
        </div>

        <div class="form-group" [class.has-error]="errors['email']">
          <label class="form-label">Email Address <span class="required">*</span></label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input
              type="email"
              [(ngModel)]="formData.email"
              name="email"
              placeholder="you@example.com"
            />
          </div>
          <span class="error-text" *ngIf="errors['email']"><i class="fas fa-circle-exclamation"></i> {{ errors['email'] }}</span>
        </div>

        <div class="form-group">
          <label class="form-label">Phone <span class="optional">(optional)</span></label>
          <div class="input-wrapper">
            <i class="fas fa-phone input-icon"></i>
            <input
              type="tel"
              [(ngModel)]="formData.phone"
              name="phone"
              placeholder="+977 98XXXXXXXX"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Message <span class="optional">(optional)</span></label>
          <div class="input-wrapper textarea-wrapper">
            <i class="fas fa-message input-icon"></i>
            <textarea
              [(ngModel)]="formData.message"
              name="message"
              placeholder="Any suggestions or questions?"
              rows="3"
            ></textarea>
          </div>
        </div>

        <button type="submit" class="submit-btn">
          <i class="fas fa-paper-plane"></i> Join the Waitlist
        </button>
      </form>
    </div>

    <!-- Success State -->
    <div class="modal-success" *ngIf="submitted">
      <!-- Confetti -->
      <div class="confetti-container">
        <div *ngFor="let c of confettiPieces" class="confetti-piece" [style.--x]="c.x" [style.--color]="c.color" [style.--delay]="c.delay" [style.--rotation]="c.rotation"></div>
      </div>

      <div class="success-checkmark">
        <div class="check-circle">
          <svg class="check-svg" viewBox="0 0 52 52">
            <circle class="check-circle-bg" cx="26" cy="26" r="25" fill="none"/>
            <path class="check-path" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
          </svg>
        </div>
      </div>
      <h2 class="success-title">Dhanyabad!</h2>
      <p class="success-text">You're on the list! We'll notify you before anyone else when K Chaiyo? launches.</p>
      <button class="close-action-btn" (click)="close()">
        <i class="fas fa-thumbs-up"></i> Awesome, Close
      </button>
    </div>
  </div>
</div>
