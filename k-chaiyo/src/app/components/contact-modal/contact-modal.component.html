<div class="modal-overlay" *ngIf="isOpen$ | async" (click)="onBackdropClick($event)">
  <div class="modal-content">
    <button class="close-btn" (click)="close()">
      <i class="fas fa-xmark"></i>
    </button>

    <!-- Form State -->
    <div class="modal-form" *ngIf="!submitted">
      <div class="modal-header">
        <div class="modal-icon">
          <i class="fas fa-envelope-open"></i>
        </div>
        <h2 class="modal-title">Join Our Waitlist!</h2>
        <p class="modal-subtitle">Pahilo mai thaha paunu hos — be the first to know when we launch!</p>
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <div class="input-wrapper">
            <i class="fas fa-user input-icon"></i>
            <input
              type="text"
              [(ngModel)]="formData.name"
              name="name"
              placeholder="Your Name"
            />
          </div>
          <span class="error-text" *ngIf="errors['name']">{{ errors['name'] }}</span>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input
              type="email"
              [(ngModel)]="formData.email"
              name="email"
              placeholder="Your Email"
            />
          </div>
          <span class="error-text" *ngIf="errors['email']">{{ errors['email'] }}</span>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <i class="fas fa-phone input-icon"></i>
            <input
              type="tel"
              [(ngModel)]="formData.phone"
              name="phone"
              placeholder="Phone Number (optional)"
            />
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper textarea-wrapper">
            <i class="fas fa-message input-icon"></i>
            <textarea
              [(ngModel)]="formData.message"
              name="message"
              placeholder="Any suggestions or questions?"
              rows="3"
            ></textarea>
          </div>
        </div>

        <button type="submit" class="submit-btn">
          <i class="fas fa-paper-plane"></i> Join the Waitlist
        </button>
      </form>
    </div>

    <!-- Success State -->
    <div class="modal-success" *ngIf="submitted">
      <div class="success-icon">
        <i class="fas fa-circle-check"></i>
      </div>
      <h2 class="modal-title">Dhanyabad!</h2>
      <p class="success-text">You're on the list! We'll notify you before anyone else when K Chaiyo? launches.</p>
      <button class="close-action-btn" (click)="close()">Close</button>
    </div>
  </div>
</div>
