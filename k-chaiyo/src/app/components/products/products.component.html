<section id="products" class="products-section">
  <div class="container">
    <div class="section-header">
      <span class="section-tag"><i class="fas fa-eye"></i> Sneak Peek</span>
      <h2 class="section-title">K Huda Paincha<span class="title-q">?</span></h2>
      <p class="section-subtitle">Here's a preview of categories we're preparing — timro lagi specially curated!</p>
    </div>

    <div class="products-grid">
      <div class="product-card" *ngFor="let cat of categories; let i = index" [attr.data-style]="cat.badgeStyle">
        <div class="icon-circle" [ngStyle]="{'background': cat.iconBg}">
          <i [class]="cat.icon" [ngStyle]="{'color': cat.iconColor}"></i>
        </div>
        <h3 class="card-title">{{ cat.title }}</h3>
        <p class="card-description">{{ cat.description }}</p>
        <span class="coming-soon-tag" [ngClass]="'badge-' + cat.badgeStyle">{{ cat.tag }}</span>
      </div>
    </div>
  </div>
</section>
